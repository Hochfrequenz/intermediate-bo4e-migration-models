[project]
name = "ibims"
description = "A Pydantic based BO4E data model that is inteded to be used in data migrations from one system to another"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Hochfrequenz Unternehmensberatung GmbH", email = "info@hochfrequenz.de" }]
keywords = ["bo4e", "pydantic", "migration"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "bomf>=0.6.8"
]
dynamic = ["readme", "version"]

[dependency-groups]
tests = [
    "pytest==8.3.3"
]
generate_bo4e = [
    "bo4e-schema-tool==0.0.9",
    "bo4e-python-generator==0.0.13",
    # datamodel-code-generator is an (unpinned) transitive dependency of
    # bo4e-python-generator==0.0.13. A fresh universal resolution pulls a version
    # that is API-incompatible with the generator (DataModelSet signature change)
    # and whose runtime needs a newer typing_extensions. Pin it to the version the
    # committed src/ibims/bo4e output was generated with so regeneration stays
    # byte-identical (see .github/workflows/bo4e_consistency.yml).
    "datamodel-code-generator==0.25.9",
    "requests==2.34.2",
    "python-dotenv==1.2.2",
    "gitpython==3.1.43",
]
linting = [
    "pylint==3.3.1",
    {include-group = "tests"},
    {include-group = "generate_bo4e"}
]
type_check = [
    "mypy==1.11.2",
    "typing-extensions>=4.7.1",
    {include-group = "tests"},
    {include-group = "generate_bo4e"}
]
spellcheck = [
    "codespell==2.3.0",
    {include-group = "tests"}
]
coverage = [
    "coverage==7.6.3",
    {include-group = "tests"}
]
formatting = [
    "black==24.10.0",
    "isort==5.13.2"
]
docs = [
    "sphinx==8.0.2",
    "sphinx_rtd_theme==3.0.1"
]
dev = [
    "pre-commit",
    {include-group = "tests"},
    {include-group = "linting"},
    {include-group = "type_check"},
    {include-group = "spellcheck"},
    {include-group = "coverage"},
    {include-group = "formatting"},
    {include-group = "generate_bo4e"},
    {include-group = "docs"}
]

[tool.uv]
default-groups = []

[project.urls]
Changelog = "https://github.com/Hochfrequenz/intermediate-bo4e-migration-models/releases"
Homepage = "https://github.com/Hochfrequenz/intermediate-bo4e-migration-models"

[tool.black]
line-length = 120

[tool.isort]
line_length = 120
profile = "black"

[tool.pylint.MASTER]
ignore-paths = ".*src/ibims/bo4e/.*"

[tool.pylint."MESSAGES CONTROL"]
max-line-length = 120
disable = "fixme,too-few-public-methods"

[build-system]
requires = ["hatchling>=1.8.0", "hatch-vcs", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"



[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"
fragments = [{ path = "README.md" }]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/_ibims_version.py"
template = '''
version = "{version}"
'''

[tool.hatch.build.targets.sdist]
exclude = ["/unittests"]

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]
