[project]
name = "ibims"
description = "A Pydantic based BO4E data model that is inteded to be used in data migrations from one system to another"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Hochfrequenz Unternehmensberatung GmbH", email = "info@hochfrequenz.de" }]
keywords = ["bo4e", "pydantic", "migration"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "bomf>=0.6.8"
]
dynamic = ["readme", "version"]

[dependency-groups]
tests = [
    "pytest==9.1.1"
]
generate_bo4e = [
    "bo4e-schema-tool==0.0.9",
    "bo4e-python-generator==0.0.13",
    # datamodel-code-generator is an (unpinned) transitive dependency of
    # bo4e-python-generator==0.0.13. A fresh universal resolution pulls a version
    # that is API-incompatible with the generator (DataModelSet signature change)
    # and whose runtime needs a newer typing_extensions. Pin it to the version the
    # committed src/ibims/bo4e output was generated with so regeneration stays
    # byte-identical (see .github/workflows/bo4e_consistency.yml).
    "datamodel-code-generator==0.72.3",
    "requests==2.34.2",
    "python-dotenv==1.2.2",
    "gitpython==3.1.59",
]
linting = [
    "ruff==0.16.2",
]
type_check = [
    "mypy==1.11.2",
    "typing-extensions>=4.7.1",
    {include-group = "tests"},
    {include-group = "generate_bo4e"}
]
spellcheck = [
    "codespell==2.4.3",
    {include-group = "tests"}
]
coverage = [
    "coverage==7.15.4",
    {include-group = "tests"}
]
docs = [
    "sphinx==8.0.2",
    "sphinx_rtd_theme==3.0.1"
]
dev = [
    "pre-commit",
    {include-group = "tests"},
    {include-group = "linting"},
    {include-group = "type_check"},
    {include-group = "spellcheck"},
    {include-group = "coverage"},
    {include-group = "generate_bo4e"},
    {include-group = "docs"}
]

[tool.uv]
default-groups = []

[project.urls]
Changelog = "https://github.com/Hochfrequenz/intermediate-bo4e-migration-models/releases"
Homepage = "https://github.com/Hochfrequenz/intermediate-bo4e-migration-models"

[tool.ruff]
line-length = 120
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "N", "PL", "RUF", "SIM", "C4", "PTH", "PT", "RET", "ARG", "TC", "PIE", "RSE", "ISC", "S"]
ignore = [
    "PLR0913", # too-many-arguments
    "PLR0917", # too-many-positional-arguments
    "PLR0912", # too-many-branches
    "PLR0915", # too-many-statements
    "PLR2004", # magic-value-comparison
    "ISC001",  # single-line-implicit-string-concatenation (conflicts with ruff format)
]

[tool.ruff.lint.isort]
known-first-party = ["ibims"]

[tool.ruff.lint.per-file-ignores]
# src/ibims/bo4e is autogenerated from the BO4E schemas (see bo4e_consistency.yml). The old
# pylint config exempted it entirely via `ignore-paths = ".*src/ibims/bo4e/.*"`; these ignores
# mirror that so the generated output is never held to hand-written-code standards.
"src/ibims/bo4e/**" = [
    "F401",   # unused-import
    "E501",   # line-too-long
    "PIE796", # non-unique-enums
    "UP007",  # non-pep604-annotation-union
    "UP042",  # replace-str-enum
    "UP045",  # non-pep604-annotation-optional
]
# Standing test-tier relaxation (asserts are the point of a test).
"unittests/**" = [
    "S101", # assert
]
# --- BEGIN generated grandfathered per-file-ignores (pre-existing violations) ---
# Auto-generated from `ruff check` output; new/changed code is held to the full select set.
# bo4e/bo4e_updater.py additionally carries S603/S607 for its shell-out to the `ruff` CLI
# (replacing the former in-process isort call); these are inherent to invoking a subprocess.
"bo4e/bo4e_updater.py" = ["ARG005", "S101", "S603", "S607", "UP035", "UP045"] # unused-lambda-argument, assert, subprocess-without-shell-equals-true, start-process-with-partial-path, deprecated-import, non-pep604-annotation-optional
"docs/conf.py" = ["PTH109", "PTH118", "PTH120", "SIM105", "UP009", "UP032"] # os-getcwd, os-path-join, os-path-dirname, suppressible-exception, utf8-encoding-declaration, f-string
"src/ibims/datasets/__init__.py" = ["F401"] # unused-import
"src/ibims/datasets/base.py" = ["B028", "ISC003", "S101", "UP008", "UP045"] # no-explicit-stacklevel, explicit-string-concatenation, assert, super-call-with-parameters, non-pep604-annotation-optional
"src/ibims/datasets/document_loader.py" = ["UP045"] # non-pep604-annotation-optional
"src/ibims/datasets/invoice_loader.py" = ["UP045"] # non-pep604-annotation-optional
"src/ibims/datasets/network_loader.py" = ["UP045"] # non-pep604-annotation-optional
"src/ibims/datasets/product_loader.py" = ["N815", "UP045"] # mixed-case-variable-in-class-scope, non-pep604-annotation-optional
"src/ibims/meta/__init__.py" = ["UP045"] # non-pep604-annotation-optional
"unittests/test_consistency.py" = ["PLC0415"] # import-outside-top-level
# --- END generated grandfathered per-file-ignores ---

[build-system]
requires = ["hatchling>=1.8.0", "hatch-vcs", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"



[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"
fragments = [{ path = "README.md" }]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/_ibims_version.py"
template = '''
version = "{version}"
'''

[tool.hatch.build.targets.sdist]
exclude = ["/unittests"]

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]
