name: "Coverage"

on: [push]
jobs:
  coverage:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: ["3.12"]
        os: [ubuntu-latest]
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --group coverage
      - name: Run Tests and Record Coverage
        run: |
          cd unittests
          uv run --group coverage coverage run -m pytest
          uv run --group coverage coverage html --omit '*/.venv/*',unittests/*
          uv run --group coverage coverage report --fail-under 80 --omit '*/.venv/*',unittests/*
