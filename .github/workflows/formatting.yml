name: "Formatting"

on: [push]
jobs:
  # The matrix "tool" values ("black", "isort") and the required-check names they produce
  # are kept unchanged on purpose, even though both now run ruff under the hood - renaming them
  # would leave the required status checks on the branch-protection ruleset permanently pending.
  black:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: ["3.12"]
        os: [ubuntu-latest]
        tool: ["black", "isort"]
        include:
          - tool: "black"
            command: "ruff format --check ."
          - tool: "isort"
            command: "ruff check --select I ."
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --group linting
      - name: ${{ matrix.tool }} Code Formatter
        run: uv run --locked --group linting ${{ matrix.command }}
