name: "Linting"

on: [push]
jobs:
  pylint:
    name: Python Code Quality and Lint
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: ["3.12"]
        os: [ubuntu-latest]
        linter-env: ["linting", "type_check", "spellcheck"]
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Dependencies (linting)
        if: matrix.linter-env == 'linting'
        run: uv sync --group linting
      - name: Install Dependencies (type_check)
        if: matrix.linter-env == 'type_check'
        run: uv sync --group type_check
      - name: Install Dependencies (spellcheck)
        if: matrix.linter-env == 'spellcheck'
        run: uv sync --group spellcheck
      - name: Run ruff check
        if: matrix.linter-env == 'linting'
        run: |
          uv run --locked --group linting ruff check .
      - name: Run mypy
        if: matrix.linter-env == 'type_check'
        run: |
          uv run --group type_check mypy --show-error-codes src/ibims
          uv run --group type_check mypy --show-error-codes unittests
          uv run --group type_check mypy --show-error-codes bo4e/bo4e_updater.py
      - name: Run codespell
        if: matrix.linter-env == 'spellcheck'
        run: uv run --group spellcheck codespell --ignore-words=domain-language.txt --skip "src/ibims/bo4e/**" src/ibims
