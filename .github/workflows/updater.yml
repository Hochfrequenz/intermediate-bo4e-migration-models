name: Check for BO4E updates
on:
  schedule:
    - cron: '23 5 * * 0'
    # Every Sunday at 5:23 am
  workflow_dispatch:
    # Enable manual workflow runs in the Actions tab

jobs:
  bo4e_updater:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: 3.12
      - name: Install Dependencies
        run: uv sync --group generate_bo4e --group formatting
      - name: Run updater
        run: |
          uv run --group generate_bo4e --group formatting python bo4e/bo4e_updater.py
        env:
          GITHUB_ACCESS_TOKEN: ${{secrets.GITHUB_TOKEN}}
